spring:
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${CHANGE_ME:}
      full-name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
  jwt:
    secret: ${CHANGE_ME:short}
    issuer: cells
    access-token-ttl: 15m
  refresh:
    ttl: 7d
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  dev-seed:
    password: ${CHANGE_ME:}
  invitation:
    ttl: 7d
    base-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    # Local default: Mailpit (docker compose up -d), inbox at http://localhost:8025
    enabled: ${MAIL_ENABLED:true}
    from: "${MAIL_FROM:CELLS <no-reply@cells.local>}"
  push:
    # Phone push needs the mobile app and a Firebase sender bean. Leave off until then.
    enabled: ${PUSH_ENABLED:false}
  clock:
    zone: ${APP_TIMEZONE:Asia/Manila}
  experience:
    points-per-submission: 10
