spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
app:
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
  jwt:
    secret: ${JWT_SECRET}
    issuer: cells
    access-token-ttl: 15m
  refresh:
    ttl: 7d
    cookie-secure: true
  invitation:
    ttl: 7d
    base-url: ${APP_FRONTEND_URL}
  mail:
    # Off until a real SMTP provider is configured (MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM).
    enabled: ${MAIL_ENABLED:false}
    from: "${MAIL_FROM:CELLS <no-reply@cells.local>}"
  push:
    # Phone push needs the mobile app and a Firebase sender bean. Leave off until then.
    enabled: ${PUSH_ENABLED:false}
  cors:
    # Origins allowed to call the API directly (the Android/iOS app). The website does not need this.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost,capacitor://localhost,http://localhost}
  clock:
    zone: ${APP_TIMEZONE:Asia/Manila}
  experience:
    points-per-submission: 10
  rate-limit:
    enabled: true
    max-requests: 10
    window: 1m
management:
  endpoints:
    web:
      exposure:
        include: health