spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: cells
    access-token-ttl: 15m
  refresh:
    ttl: 7d
    cookie-secure: true
  invitation:
    ttl: 7d
    base-url: ${APP_FRONTEND_URL}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: Platform Administrator
  rate-limit:
    enabled: true
    max-requests: 10
    window: 1m
management:
  endpoints:
    web:
      exposure:
        include: health