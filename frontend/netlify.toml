[build]
  command = "npm run build"
  publish = "dist"
  # Saves Netlify credits: skip the build (exit 0 = skip) when nothing inside frontend/ changed since the last
  # successful deploy, for example a backend-only or docs-only merge. Any change in frontend/ still builds.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/*"
  to = "https://cells-d3m6.onrender.com/api/:splat"
  status = 200
  force = true
  # Netlify signs each proxied request (x-nf-sign) with the value of this site variable, so the backend can trust the
  # visitor address Netlify supplies. The variable must exist in Netlify (scope includes Runtime) before this is deployed.
  signed = "CELLS_PROXY_SIGN_SECRET"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'"